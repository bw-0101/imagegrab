<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图提取 - 图片画廊</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <!-- 顶部操作栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
      </span>
      <h1>图提取</h1>
      <span class="stats" id="stats">已选 <b id="selCount">0</b> / 共 <b id="totalCount">0</b></span>
    </div>
    <div class="topbar-right">
      <button class="btn ghost" id="btnSelectAll">全选</button>
      <button class="btn ghost" id="btnInvert">反选</button>
      <button class="btn primary" id="btnDownload">下载选中</button>
    </div>
  </header>

  <!-- 下载进度条 -->
  <div class="progress" id="progress" hidden>
    <div class="progress-bar" id="progressBar"></div>
    <span class="progress-text" id="progressText"></span>
  </div>

  <!-- 图片网格 -->
  <main class="grid" id="grid"></main>

  <!-- 空状态 -->
  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#b6bccb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"></rect>
      <circle cx="8.5" cy="8.5" r="1.5"></circle>
      <path d="M21 15l-5-5L5 21"></path>
    </svg>
    <p>没有可用的图片列表。<br />请回到电商商品详情页，点击右下角「获取图片」按钮。</p>
    <a class="btn primary" href="#" id="btnBack">返回详情页</a>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
